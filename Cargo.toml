[workspace]
members = ["crates/timescale-core", "crates/timescale-tui"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/davafons/timescale"
rust-version = "1.88"

[workspace.dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
crossterm = { version = "0.29.0", default-features = false, features = ["events"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.149"
tachyonfx = { version = "0.25.1", default-features = false }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
