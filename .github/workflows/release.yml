name: Release

on:
  push:
    tags: ['v*.*.*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  package:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.0'
      - name: Install ShellCheck
        run: brew install shellcheck
      - name: Lint
        run: make lint
      - name: Validate release version
        run: |
          version="${GITHUB_REF_NAME#v}"
          plist_version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)
          test "$version" = "$plist_version" || {
            echo "Tag version $version does not match Info.plist version $plist_version" >&2
            exit 1
          }
      - name: Test
        run: swift test
      - name: Import Developer ID certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          if [ -z "$CERTIFICATE_BASE64" ]; then
            echo "No signing certificate configured; producing an ad-hoc signed release."
            exit 0
          fi
          certificate_path="$RUNNER_TEMP/timescale-release.p12"
          keychain_path="$RUNNER_TEMP/timescale-signing.keychain-db"
          echo "$CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security list-keychain -d user -s "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$keychain_path"
          echo "CODE_SIGN_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"
      - name: Package universal app
        env:
          TIMESCALE_BUILD_NUMBER: ${{ github.run_number }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: ./scripts/package-release.sh "${GITHUB_REF_NAME#v}"
      - name: Verify release artifacts
        run: |
          codesign --verify --deep --strict build/Timescale.app
          lipo build/Timescale.app/Contents/MacOS/Timescale -verify_arch x86_64 arm64
          (cd dist && shasum -a 256 -c SHA256SUMS)
          unzip -tq "dist/Timescale-${GITHUB_REF_NAME#v}-macOS-universal.zip"
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.zip
            dist/*.dmg
            dist/SHA256SUMS
